/* EL PARAGOLPE DIBUJADO (FLECHA ROJA + BARRA) */
.paragolpe-diseno {
    position: absolute;
    width: 25px;
    height: 20px;
    z-index: 100;
}

/* La flecha roja (Triángulo) */
.paragolpe-diseno::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    width: 0;
    height: 0;
    border-top: 10px solid transparent;
    border-bottom: 10px solid transparent;
    border-right: 15px solid #ff0000; /* Color rojo puro */
}

/* La barra vertical de tope */
.paragolpe-diseno::after {
    content: "";
    position: absolute;
    right: 0;
    top: 0;
    width: 4px;
    height: 20px;
    background-color: #ff0000;
}

/* La línea pequeña que une la flecha con la barra */
.paragolpe-diseno .union {
    position: absolute;
    left: 15px;
    top: 8px;
    width: 6px;
    height: 4px;
    background-color: #ff0000;
}

    /* Definimos el patrón uniforme aquí. 
       Cambia estos valores y TODAS las líneas cambiarán a la vez. */
   .root {
        --raya: 12px;    /* Tamaño de la rayita */
        --espacio: 8px;  /* Espacio vacío */
        --grosor: 2px;   /* Grosor de la línea */
        --color: #fff;
    }

    .linea {
        position: absolute;
        background-repeat: repeat;
    }

    /* Vertical: El patrón es constante */
    .vertical {
        width: var(--grosor);
        background-image: repeating-linear-gradient(
            to bottom,
            var(--color) 0px, var(--color) var(--raya),
            transparent var(--raya), transparent calc(var(--raya) + var(--espacio))
        );
    }

    /* Horizontal: El patrón es constante */
    .horizontal {
        height: var(--grosor);
        background-image: repeating-linear-gradient(
            to right,
            var(--color) 0px, var(--color) var(--raya),
            transparent var(--raya), transparent calc(var(--raya) + var(--espacio))
        );
    }
/* Borra lo anterior de .linea-v y .linea-h y pon esto */
.linea-limite {
    position: absolute;
    z-index: 999;
    border-color: #fff; /* Color blanco */
    border-style: dashed; /* Esto crea los segmentos automáticamente */
}

/* Línea Vertical */
.linea-v {
    border-left-width: 2px; /* Grosor de la línea */
    border-top: 0;
    border-bottom: 0;
    border-right: 0;
}

/* Línea Horizontal */
.linea-h {
    border-top-width: 2px; /* Grosor de la línea */

    function setEstadoCircuito(idCircuito, numEstado) {
    const el = document.getElementById(idCircuito);
    if (!el) return;

    const estados = { 
        3: 'via-fantasma', 0: 'libreconI', 1: 'ocupado', 2: 'libresinI', 
        4: 'maniobra', 5: 'libredeslizamiento', 6: 'zonasinseñalizar',
        7: 'CVMXCS', 8: 'CVCRAS', 9: 'BVACVSD'
    };

    // Mantenemos las clases estructurales críticas
    const esArriba = el.classList.contains('v-arriba');
    const esAbajo = el.classList.contains('v-abajo');
    const esDiagonal = el.classList.contains('diagonal');
    const esCambioSiemens = el.classList.contains('cambio-siemens'); // Nueva clase
    
    // Construimos la clase base preservando la estructura
    let nuevasClases = 'via';
    if (esArriba) nuevasClases += ' v-arriba';
    if (esAbajo) nuevasClases += ' v-abajo';
    if (esDiagonal) nuevasClases += ' diagonal';
    if (esCambioSiemens) nuevasClases += ' cambio-siemens';
    
    el.className = nuevasClases; 
    
    // Aplicamos el estado
    if (estados[numEstado]) {
        el.classList.add(estados[numEstado]);
    }
}

    function sincronizarViasEspejo(dataVic) {
        if (!dataVic || !dataVic.vias) return;
        var estadoVia = dataVic.vias["cv-vic"];
        if (estadoVia !== undefined) {
            var elRecta = document.getElementById('cv-vic');
            var elDiagonal = document.getElementById('cvv-vic');
            var esLibre = (estadoVia === 0);
            if (elRecta) { elRecta.classList.toggle('libre', esLibre); elRecta.classList.toggle('ocupado', !esLibre); }
            if (elDiagonal) { elDiagonal.classList.toggle('libre', esLibre); elDiagonal.classList.toggle('ocupado', !esLibre); }
        }
    }

function obtenerColorPorEstado(estado) {
    switch(estado) {
        case 1: return 'ocupado';      // Rojo
        case 4: return 'maniobra';     // Celeste
        case 0: return 'libreconI';    // Verde
        case 2: return 'libresinI';    // Amarillo
        default: return 'via-fantasma';
    }
}

   



    // Ejecuta esto al cargar la página para "anclar" los nombres
    function anclarNombres() {
        document.querySelectorAll('.via').forEach(via => {
            if (!via.dataset.nombre) return;
            
            // Creamos la etiqueta como un hijo del contenedor principal, no de la vía
            const label = document.createElement('span');
            label.className = 'nombre-via-label';
            label.innerText = via.dataset.nombre;
            
            // Obtenemos coordenadas de la vía
            const rect = via.getBoundingClientRect();
            const container = document.querySelector('.map-container');
            
            // Posicionamos la etiqueta calculando el centro de la vía
            label.style.left = (via.offsetLeft + (via.offsetWidth / 2)) + 'px';
            label.style.transform = 'translateX(-50%)';
            
            if (via.classList.contains('v-arriba')) {
                label.style.top = (via.offsetTop - 15) + 'px';
            } else {
                label.style.top = (via.offsetTop + 12) + 'px';
            }
            
            container.appendChild(label);
        });
    }

    // Ejecutar una vez al cargar
    window.addEventListener('load', anclarNombres);
